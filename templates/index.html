<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Ejercicios</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .menu-container {
            display: flex;
            gap: 25px;
            background: #ffffff;
            padding: 50px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        .btn-box {
            display: inline-block;
            width: 160px;
            height: 160px;
            line-height: 160px;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            border-radius: 4px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .btn-purple {
            background-color: #800b80;
        }
        .btn-green {
            background-color: #71a308;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <a href="/ejercicio1" class="btn-box btn-purple">Ejercicio 1</a>
        <a href="/ejercicio2" class="btn-box btn-green">Ejercicio 2</a>
    </div>

</body>
</html>
