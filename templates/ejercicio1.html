<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Compras</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 22px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            color: #7f8c8d;
            font-size: 15px;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 15px;
            color: #2f3640;
            text-align: center;
            background-color: #fcfcfc;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
            background-color: #fff;
        }
        .btn-submit {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        hr {
            border: 0;
            border-top: 1px solid #eceff1;
            margin: 30px 0;
        }
        .resultado-box {
            text-align: left;
            color: #333333;
            font-size: 16px;
            line-height: 1.8;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 4px;
            border-left: 4px solid #007bff;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Calculo de compras</h2>

        <form action="/ejercicio1" method="POST">
            <div class="form-group">
                <label>Ingresa tu nombre</label>
                <input type="text" name="nombre" required autocomplete="off">
            </div>

            <div class="form-group">
                <label>Ingresa tu edad</label>
                <input type="number" name="edad" min="0" required>
            </div>

            <div class="form-group">
                <label>Ingresa la cantidad de tarros de pintura a comprar</label>
                <input type="number" name="cantidad" min="1" required>
            </div>

            <button type="submit" class="btn-submit">Calcular</button>
        </form>

        {% if resultado %}
            <hr>
            <div class="resultado-box">
                <p><strong>Nombre del comprador:</strong> {{ resultado.nombre }}</p>
                <p><strong>Total sin descuento:</strong> ${{ resultado.total_sin_descuento }}</p>
                <p><strong>Descuento aplicado:</strong> ${{ resultado.monto_descuento }}</p>
                <p><strong>Total a pagar:</strong> ${{ resultado.total_pagar }}</p>
            </div>
        {% endif %}
    </div>

</body>
</html>
